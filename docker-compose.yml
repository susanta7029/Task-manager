services:
  client:
    build:
      context: ./client
    environment:
      - NODE_OPTIONS=--openssl-legacy-provider
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    container_name: server   # ✅ Add this line
    build:
      context: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
